name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Downloads system libraries from Ubuntu's servers, which occasionally
      # can't be reached from GitHub's runners: try up to three times.
      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Attempt $attempt failed; trying again in 20 seconds"
            sleep 20
          done
          exit 1

      # Runs without Supabase secrets, so pull requests from forks of this
      # public repo can't read them. The "connected" tests are skipped here.
      - name: API and UI tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7